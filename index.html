<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Stock, orders, payouts, expenses and profit for Meesho and Flipkart sellers.">
<meta name="theme-color" content="#2747B5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khata">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Seller Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: a seller's khata (ledger) — sidebar on desktop, bottom tabs + quick-add on phone; ruled rows, ink-blue figures */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#ECEFF5; --line:#DCE2EB; --line-2:#C5CEDB;
  --ink:#121A27; --ink-2:#435063; --ink-3:#717D91;
  --accent:#2747B5; --accent-ink:#FFFFFF; --accent-soft:#E5EAFA;
  --good:#11734A; --good-soft:#E0F2E9; --bad:#BC3227; --bad-soft:#FBE6E3; --warn:#9A5A00; --warn-soft:#FAEFD9;
  --meesho:#9B1E86; --flipkart:#1F67D8; --other:#5B6577;
  --bar:#C9D3F2; --scrim:rgba(10,14,22,.46);
  --shadow:0 1px 2px rgba(18,26,39,.06),0 8px 24px rgba(18,26,39,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Mukta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1118; --surface:#131A24; --surface-2:#1A2330; --line:#243041; --line-2:#344358;
    --ink:#E6ECF4; --ink-2:#A8B3C3; --ink-3:#7E8A9C;
    --accent:#90A8FF; --accent-ink:#0C1118; --accent-soft:#1C2849;
    --good:#4CC98E; --good-soft:#12342A; --bad:#FF8075; --bad-soft:#3B1B18; --warn:#F0B451; --warn-soft:#382A10;
    --meesho:#E47FD2; --flipkart:#78A9FF; --other:#A4AEBE;
    --bar:#2B3D6E; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1118; --surface:#131A24; --surface-2:#1A2330; --line:#243041; --line-2:#344358;
  --ink:#E6ECF4; --ink-2:#A8B3C3; --ink-3:#7E8A9C;
  --accent:#90A8FF; --accent-ink:#0C1118; --accent-soft:#1C2849;
  --good:#4CC98E; --good-soft:#12342A; --bad:#FF8075; --bad-soft:#3B1B18; --warn:#F0B451; --warn-soft:#382A10;
  --meesho:#E47FD2; --flipkart:#78A9FF; --other:#A4AEBE;
  --bar:#2B3D6E; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.15}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.pos{color:var(--good)} .neg{color:var(--bad)} .warn-t{color:var(--warn);font-weight:600}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line)}
.side-in{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;height:100vh;box-sizing:border-box;padding-block:18px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;min-width:0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-weight:500;text-align:left;font-size:15px}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn svg{flex:none}
.side-add{padding:12px 4px 4px}
.side-add .btn{width:100%}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;margin-top:6px}
.dot.off{background:var(--warn)}
.col{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.main{min-width:0;padding-block:26px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;gap:10px;background:var(--bg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0}
  .topbar .brand-mark{width:32px;height:32px;font-size:18px;border-radius:9px}
  .main{padding-block:16px calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  h1{font-size:23px}
}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.tab[aria-current="page"]{color:var(--accent)}
.tab-add{align-self:center}
.tab-add span.plus{width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);margin-top:-18px}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.ph-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.ph-t p{color:var(--ink-3)}
.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .cnt{font-family:var(--f-num);font-size:12px;opacity:.7;margin-left:4px}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;white-space:nowrap;font-size:14.5px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{background:var(--accent);filter:brightness(1.08)}
.btn-d{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn-d:hover{background:var(--bad-soft);filter:brightness(.97)}
.btn-sm{min-height:32px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:inherit}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:12.5px;line-height:1.35}
.in{height:42px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:0 12px;width:100%;box-sizing:border-box;min-width:0;font-size:15px}
select.in{padding-right:30px}
textarea.in{height:auto;min-height:70px;padding:9px 12px;resize:vertical;line-height:1.4}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inr{position:relative;display:block}
.inr::before{content:"₹";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.inr .in{padding-left:27px}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.r3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;width:100%}
.seg button{flex:1;border:0;background:var(--surface);padding:9px 6px;font-weight:600;font-size:14px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{color:var(--ink-3);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g-side{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:1000px){.g2,.g-side{grid-template-columns:minmax(0,1fr)}}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:18px 28px;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-3)}
.hero-v{font-family:var(--f-num);font-weight:600;font-size:clamp(30px,8vw,44px);letter-spacing:-.04em;line-height:1.05;overflow-wrap:anywhere}
.hero-sub{font-size:14px;color:var(--ink-2)}
.ledger{display:flex;flex-direction:column;font-size:14.5px}
.ledger-r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.ledger-r:last-child{border-bottom:0;font-weight:700;border-top:1.5px solid var(--ink);margin-top:2px;padding-top:9px}
.ledger-r span:first-child{color:var(--ink-2)}
.ledger-r:last-child span:first-child{color:var(--ink)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:13.5px;line-height:1.4}
.note svg{flex:none;margin-top:1px}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note .btn-link{color:inherit;text-decoration:underline}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi-l{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi-v{font-family:var(--f-num);font-weight:600;font-size:clamp(19px,4.6vw,24px);letter-spacing:-.03em;overflow-wrap:anywhere;line-height:1.2}
.kpi-s{font-size:12.5px;color:var(--ink-3)}

/* chart */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%}
.ch-t{fill:var(--ink-3);font-size:11px;font-family:var(--f-num)}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-zero{stroke:var(--line-2);stroke-width:1}
.ch-inc{fill:var(--bar)}
.ch-pro{fill:var(--good)}
.ch-loss{fill:var(--bad)}
.ch-sel{fill:var(--surface-2)}
.readout{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);min-height:20px;margin-bottom:6px}
.readout b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* platform split */
.plats{display:flex;flex-direction:column;gap:14px}
.plat-row{display:flex;flex-direction:column;gap:6px}
.plat-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.plat{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
.plat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pm i,.bar .pm{background:var(--meesho)} .pf i,.bar .pf{background:var(--flipkart)} .px i,.bar .px{background:var(--other)}

/* pills */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-pending{background:var(--warn-soft);color:var(--warn)}
.s-shipped{background:var(--accent-soft);color:var(--accent)}
.s-delivered{background:var(--good-soft);color:var(--good)}
.s-rto,.s-return{background:var(--bad-soft);color:var(--bad)}
.s-cancelled,.s-lost{background:var(--surface-2);color:var(--ink-3)}
.stock-ok{background:var(--good-soft);color:var(--good)}
.stock-low{background:var(--warn-soft);color:var(--warn)}
.stock-out{background:var(--bad-soft);color:var(--bad)}

/* thumbs */
.thumb{border-radius:10px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;flex:none;color:var(--ink-3);font-family:var(--f-display);font-weight:700;font-size:13px;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* lists */
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:inherit}
.lrow:last-child{border-bottom:0}
button.lrow:hover{background:var(--surface-2)}
.lrow-m{min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow-t{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.lrow-s{font-size:13px;color:var(--ink-3);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.lrow-e{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.lrow-e .num{font-weight:600}

/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{display:flex;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%;color:inherit;min-width:0;align-items:flex-start}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pcard-m{min-width:0;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard-t{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.pcard-row{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center}
.sku{font-family:var(--f-num);font-size:11.5px;background:var(--surface-2);border-radius:6px;padding:1px 6px;color:var(--ink-2);overflow-wrap:anywhere}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line-2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0}
.tbl .pn{display:flex;gap:10px;align-items:center;min-width:180px}

/* sheets */
.ov{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--surface);border-radius:18px;width:min(620px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.sheet.wide{width:min(820px,100%)}
.sheet-h{display:flex;align-items:center;gap:12px;padding:14px 18px 14px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0}
.sheet-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet-f .grow{min-width:0}
@media(max-width:640px){
  .ov{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{width:100%;border-radius:18px 18px 0 0;max-height:94%}
  .sheet-h,.sheet-b,.sheet-f{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sheet-f{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 2px}

function dayLong(iso){ if (!iso) return '—'; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
function fmtINR(n, dec){

  const d = dec != null ? dec : (a < 1000 && Math.round(a * 100) % 100 !== 0 ? 2 : 0);

}
function fmtShort(n){
  const a = Math.abs(n), s = n < 0 ? '−' : '';

  if (a >= 1e5) return s + '₹' + (a / 1e5).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/, '') + ' L';

/* ======================= store ======================= */

const queues = new Map();
function enqueue(path, fn){

function requireDb(){ if (st.sample) throw { code: 'sample' }; if (!st.db) throw { code: 'nodb' }; }
async function putDoc(path, data){ requireDb(); return enqueue(path, () => withRetry(() => st.db.doc(path).set(strip(data)))); }
async function rmDoc(path){ requireDb(); return enqueue(path, () => withRetry(() => st.db.doc(path).delete())); }

async function saveProduct(p){
  requireDb();
  const id = p.id || uid('p');
  const doc = strip({ ...p, id, upd: Date.now(), created: p.created || Date.now() });
  await putDoc('products/' + id, doc);
  st.products = { ...st.products, [id]: doc }; emit();
  return id;
}
async function deleteProduct(id){
  requireDb();
  const p = st.products[id];
  await rmDoc('products/' + id);
  const m = { ...st.products }; delete m[id]; st.products = m; emit();
  if (p && p.images && st.assets){ for (const a of p.images){ try { await st.assets.delete(a); } catch (e) { console.warn(e); } } }
}
async function saveSettings(patch){
  requireDb();
  const next = { ...st.settings, ...patch };
  await putDoc('meta/settings', next);
  st.settings = next; emit();
}
async function putItem(coll, item){
  requireDb();
  const m = monthOf(item.d);
  const cur = st[coll][m];
  const doc = { m, items: { ...(cur && cur.items || {}), [item.id]: strip(item) } };
  await putDoc(coll + '/' + m, doc);
  st[coll] = { ...st[coll], [m]: doc }; emit();
}
async function removeItem(coll, item){
  requireDb();
  const m = monthOf(item.d); const cur = st[coll][m];
  if (!cur || !cur.items || !cur.items[item.id]) return;
  const items = { ...cur.items }; delete items[item.id];
  if (Object.keys(items).length){ const doc = { m, items }; await putDoc(coll + '/' + m, doc); st[coll] = { ...st[coll], [m]: doc }; }
  else { await rmDoc(coll + '/' + m); const c2 = { ...st[coll] }; delete c2[m]; st[coll] = c2; }
  emit();
}
async function updateItem(coll, oldItem, item){
  if (oldItem && monthOf(oldItem.d) !== monthOf(item.d)) await removeItem(coll, oldItem);
  await putItem(coll, item);
}

/* ---------- orders ---------- */
const chunkId = (p, m, id) => `${p}-${m.replace('-', '')}-${hashStr(id) % ORD_PARTS}`;
function orderIndex(){ const idx = new Map(); for (const [cid, ch] of Object.entries(st.chunks)) for (const k of Object.keys(ch.rows || {})) idx.set(ch.p + ':' + k, cid); return idx; }
function getOrder(p, i){ const cid = orderIndex().get(p + ':' + i); return cid ? st.chunks[cid].rows[i] : null; }
function ordersOfMonth(m){ const out = []; for (const ch of Object.values(st.chunks)) if (ch.m === m) for (const o of Object.values(ch.rows || {})) out.push(o); return out; }

async function ensureMonths(ms){
  requireDb();
  const need = [...new Set(ms)].filter(m => m && !isLoadedSt(m));
  for (const m of need){
    const snap = await withRetry(() => st.db.collection('ord').where('m', '==', m).limit(1000).get());
    snap.docs.forEach(d => { if (d.exists) st.chunks[d.id] = d.data(); });
    st.extra.add(m);
  }
  if (need.length) emit();
}
async function loadAllMonths(){
  requireDb();
  const snap = await withRetry(() => st.db.collection('ord').limit(1000).get());
  snap.docs.forEach(d => { if (d.exists) st.chunks[d.id] = d.data(); });
  st.allLoaded = true; emit();
}
async function commitOrders(edits, onProg){
  requireDb();
  const idx = orderIndex(); const work = new Map(); const months = new Set();
  const getWork = cid => {
    if (!work.has(cid)){
      const cur = st.chunks[cid]; const [p, mm, k] = cid.split('-');
      work.set(cid, cur ? { ...cur, rows: { ...(cur.rows || {}) } } : { p, m: mm.slice(0, 4) + '-' + mm.slice(4), k: Number(k), rows: {} });
    }
    return work.get(cid);
  };
  for (const e of edits){
    const oldCid = idx.get(e.p + ':' + e.i);
    if (oldCid){ const w = getWork(oldCid); delete w.rows[e.i]; months.add(w.m); }
    if (e.next){ const m = monthOf(e.next.d); const cid = chunkId(e.p, m, e.i); getWork(cid).rows[e.i] = strip(e.next); months.add(m); idx.set(e.p + ':' + e.i, cid); }
    else idx.delete(e.p + ':' + e.i);
  }
  let n = 0;
  for (const [cid, doc] of work){
    if (!Object.keys(doc.rows).length){ if (st.chunks[cid]){ await rmDoc('ord/' + cid); delete st.chunks[cid]; } }
    else {
      if (JSON.stringify(doc).length > 245000) throw { code: 'chunk_full' };
      await putDoc('ord/' + cid, doc); st.chunks[cid] = doc;
    }
    n++; if (onProg) onProg(n, work.size); emit();
  }
  await refreshStats([...months]);
}
async function refreshStats(months){
  for (const m of months){
    if (!isLoadedSt(m)) continue;
    const s = computeMonthStats(m, ordersOfMonth(m), st.products, st.settings);
    if (!s.n && !s.can){ if (st.stats[m]){ await rmDoc('stats/' + m); const c = { ...st.stats }; delete c[m]; st.stats = c; } }
    else { await putDoc('stats/' + m, s); st.stats = { ...st.stats, [m]: s }; }
  }
  emit();
}

/* ======================= calculations ======================= */
function orderCalc(o, products, settings){
  const q = Math.max(1, Number(o.q) || 1);
  const p = o.pid ? products[o.pid] : null;
  const has = v => v != null && v !== '';
  const uc = has(o.uc) ? Number(o.uc) : (p ? Number(p.cost) || 0 : 0);
  const pk = has(o.pk) ? Number(o.pk) : (p && has(p.packing) ? Number(p.packing) : Number(settings.packing) || 0);
  const stt = STATUS[o.st] ? o.st : 'pending';
  const paid = !!(o.set && Object.keys(o.set).length);
  const recv = paid ? sumSet(o.set) : 0;
  let expected = 0, est = '';
  if (!paid && (stt === 'pending' || stt === 'shipped' || stt === 'delivered')){
    const po = p && p.payout ? Number(p.payout[o.p]) : 0;
    if (po > 0){ expected = po * q; est = 'product'; }
    else if (Number(o.s) > 0){ expected = Number(o.s) * (1 - (Number(settings.fee) || 0) / 100); est = 'fee'; }
  }
  let cost = 0;
  if (stt !== 'cancelled'){ cost = pk * q; const back = (stt === 'rto' || stt === 'return') && o.rs !== false; if (!back) cost += uc * q; }
  const income = paid ? recv : expected;
  return { q, uc, pk, st: stt, paid, recv, expected: round2(expected), est, income: round2(income), cost: round2(cost), profit: round2(income - cost), noCost: !!p && !(Number(p.cost) > 0), unlinked: !p };
}
function computeMonthStats(m, orders, products, settings){
  const s = { m, n: 0, can: 0, q: 0, sale: 0, recv: 0, expd: 0, cost: 0, profit: 0, rto: 0, ret: 0, out: {}, back: {}, plat: {}, u: Date.now() };
  for (const o of orders){
    const c = orderCalc(o, products, settings);
    if (c.st === 'cancelled'){ s.can++; continue; }
    s.n++; s.q += c.q; s.sale += Number(o.s) || 0;
    if (c.paid) s.recv += c.recv; else s.expd += c.expected;
    s.cost += c.cost; s.profit += c.profit;
    if (c.st === 'rto') s.rto++; if (c.st === 'return') s.ret++;
    if (o.pid){ s.out[o.pid] = (s.out[o.pid] || 0) + c.q; if ((c.st === 'rto' || c.st === 'return') && o.rs !== false) s.back[o.pid] = (s.back[o.pid] || 0) + c.q; }
    const pl = s.plat[o.p] || (s.plat[o.p] = { n: 0, inc: 0, profit: 0 }); pl.n++; pl.inc = round2(pl.inc + c.income); pl.profit = round2(pl.profit + c.profit);
  }
  for (const k of ['sale', 'recv', 'expd', 'cost', 'profit']) s[k] = round2(s[k]);
  return s;
}

function derive(){
  if (dcache) return dcache;
  const src = st.sample ? sampleData() : st;
  const products = src.products, settings = src.settings;
  const isLoaded = st.sample ? (() => true) : isLoadedSt;
  const orders = [];
  for (const ch of Object.values(src.chunks)) for (const o of Object.values(ch.rows || {})) orders.push(o);
  orders.sort((a, b) => (b.d || '').localeCompare(a.d || '') || String(b.i).localeCompare(String(a.i)));
  const calc = new Map(), byKey = new Map(), byMonth = new Map();
  for (const o of orders){
    calc.set(o, orderCalc(o, products, settings)); byKey.set(o.p + ':' + o.i, o);
    const m = monthOf(o.d); if (!byMonth.has(m)) byMonth.set(m, []); byMonth.get(m).push(o);
  }
  const stock = {}, sold30 = {};
  for (const p of Object.values(products)) stock[p.id] = Number(p.open) || 0;
  const moves = [];
  for (const doc of Object.values(src.stk)) for (const it of Object.values(doc.items || {})){ moves.push(it); if (stock[it.pid] != null) stock[it.pid] += Number(it.q) || 0; }
  moves.sort((a, b) => (b.d || '').localeCompare(a.d || ''));
  const d30 = addDays(today(), -29);
  for (const o of orders){
    const c = calc.get(o);
    if (!o.pid || stock[o.pid] == null || c.st === 'cancelled') continue;
    stock[o.pid] -= c.q;
    if ((c.st === 'rto' || c.st === 'return') && o.rs !== false) stock[o.pid] += c.q;
    else if (o.d >= d30) sold30[o.pid] = (sold30[o.pid] || 0) + c.q;
  }
  for (const [m, s] of Object.entries(src.stats)){
    if (isLoaded(m)) continue;
    for (const [pid, q] of Object.entries(s.out || {})) if (stock[pid] != null) stock[pid] -= q;
    for (const [pid, q] of Object.entries(s.back || {})) if (stock[pid] != null) stock[pid] += q;
  }
  const expenses = [];
  for (const doc of Object.values(src.exp)) for (const it of Object.values(doc.items || {})) expenses.push(it);
  expenses.sort((a, b) => (b.d || '').localeCompare(a.d || '') || String(b.id).localeCompare(String(a.id)));
  const skuMap = new Map();
  for (const p of Object.values(products)) for (const s of (p.skus || [])) skuMap.set(normSku(s), p.id);
  const plist = Object.values(products).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  dcache = { products, plist, settings, orders, calc, byKey, byMonth, stock, sold30, moves, expenses, stats: src.stats, isLoaded, skuMap };
  return dcache;
}
function lowAt(p, settings){ return p.low != null && p.low !== '' ? Number(p.low) : Number(settings.low) || 0; }
function stockState(p, D){ const q = D.stock[p.id] || 0; if (q <= 0) return 'out'; if (q <= lowAt(p, D.settings)) return 'low'; return 'ok'; }

const PERIODS = [['today', 'Today'], ['7d', '7 days'], ['month', 'This month'], ['lastmonth', 'Last month'], ['90d', '90 days'], ['fy', 'This FY']];
function periodRange(k){
  const t = today(), ym = monthOf(t);
  switch (k){
    case 'today': return { k, from: t, to: t, label: 'Today', bucket: 'day' };
    case '7d': return { k, from: addDays(t, -6), to: t, label: 'Last 7 days', bucket: 'day' };
    case 'lastmonth': { const pm = addMonths(ym, -1); return { k, from: pm + '-01', to: addDays(ym + '-01', -1), label: monthLabel(pm), bucket: 'day' }; }
    case '90d': return { k, from: addDays(t, -89), to: t, label: 'Last 90 days', bucket: 'day' };
    case 'fy': { const [y, m] = ym.split('-').map(Number); const fy = m >= 4 ? y : y - 1; return { k, from: fy + '-04-01', to: t, label: `FY ${fy}–${String(fy + 1).slice(2)}`, bucket: 'month' }; }
    default: return { k: 'month', from: ym + '-01', to: t, label: monthLabel(ym), bucket: 'day' };
  }
}
function summarize(D, R){
  const { from, to } = R;
  const T = { all: 0, n: 0, can: 0, q: 0, qSold: 0, sale: 0, recv: 0, expd: 0, cost: 0, profit: 0, rto: 0, ret: 0, exp: 0, unlinked: 0, plat: {}, prod: new Map(), noCost: new Set(), estFee: 0 };
  const bk = new Map();
  if (R.bucket === 'month'){ for (let m = monthOf(from); m <= monthOf(to); m = addMonths(m, 1)) bk.set(m, { key: m, label: monthShort(m), inc: 0, profit: 0, n: 0 }); }
  else { for (let d = from; d <= to; d = addDays(d, 1)) bk.set(d, { key: d, label: dayLabel(d), inc: 0, profit: 0, n: 0 }); }
  for (const o of D.orders){
    const d = o.d; if (!d || d < from || d > to) continue;
    const c = D.calc.get(o); T.all++;
    if (c.st === 'cancelled'){ T.can++; continue; }
    T.n++; T.q += c.q; if (c.st !== 'rto' && c.st !== 'return' && c.st !== 'lost') T.qSold += c.q;
    T.sale += Number(o.s) || 0;
    if (c.paid) T.recv += c.recv; else T.expd += c.expected;
    if (c.est === 'fee') T.estFee++;
    T.cost += c.cost; T.profit += c.profit;
    if (c.st === 'rto') T.rto++; if (c.st === 'return') T.ret++;
    if (c.unlinked) T.unlinked++; if (c.noCost) T.noCost.add(o.pid);
    const pl = T.plat[o.p] || (T.plat[o.p] = { n: 0, inc: 0, profit: 0 }); pl.n++; pl.inc += c.income; pl.profit += c.profit;
    const b = bk.get(R.bucket === 'month' ? monthOf(d) : d); if (b){ b.inc += c.income; b.profit += c.profit; b.n++; }
    const key = o.pid || ('u:' + normSku(o.sku || o.t || '?'));
    const pr = T.prod.get(key) || { key, pid: o.pid, name: (o.pid && D.products[o.pid] && D.products[o.pid].name) || o.t || o.sku || 'Unlinked item', q: 0, n: 0, inc: 0, profit: 0, back: 0 };
    pr.n++; pr.q += c.q; pr.inc += c.income; pr.profit += c.profit; if (c.st === 'rto' || c.st === 'return') pr.back++;
    T.prod.set(key, pr);
  }
  for (const e of D.expenses) if (e.d >= from && e.d <= to) T.exp += Number(e.a) || 0;
  T.income = T.recv + T.expd; T.net = T.profit - T.exp; T.buckets = [...bk.values()];
  return T;
}
function allTime(D){
  let invested = 0, buys = 0;
  for (const p of Object.values(D.products)) invested += (Number(p.open) || 0) * (Number(p.cost) || 0);
  for (const mv of D.moves) if (mv.k === 'buy'){ invested += Number(mv.c) || 0; buys++; }
  let exp = 0; for (const e of D.expenses) exp += Number(e.a) || 0;
  let recv = 0, expd = 0;
  for (const o of D.orders){ const c = D.calc.get(o); if (c.st === 'cancelled') continue; if (c.paid) recv += c.recv; else expd += c.expected; }
  for (const [m, s] of Object.entries(D.stats)) if (!D.isLoaded(m)){ recv += s.recv || 0; expd += s.expd || 0; }
  let stockVal = 0, units = 0;
  for (const p of Object.values(D.products)){ const q = Math.max(0, D.stock[p.id] || 0); units += q; stockVal += q * (Number(p.cost) || 0); }
  return { invested, exp, recv, expd, stockVal, units, buys, net: recv + expd + stockVal - invested - exp };
}
function unpaidOld(D){
  const lim = addDays(today(), -14); let n = 0, amt = 0;
  for (const o of D.orders){ const c = D.calc.get(o); if (c.st === 'delivered' && !c.paid && o.d && o.d <= lim){ n++; amt += c.expected; } }
  return { n, amt };
}

let SAMPLE = null;
function sampleData(){
  if (SAMPLE) return SAMPLE;
  let seed = 20261021;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const P = [
    { id: 's1', name: 'Ice Roller for Face (Pack of 2)', skus: ['IR-P2-PURPLE'], cat: 'Beauty', cost: 42, packing: 5, open: 120, low: 20, price: { m: 159, f: 149 }, payout: { m: 121, f: 104 }, w: 3.2 },

    { id: 's3', name: 'Twist Corn Peeler', skus: ['CORN-TWIST'], cat: 'Kitchen', cost: 22, packing: 4, open: 220, low: 25, price: { m: 119 }, payout: { m: 88 }, w: 2.4 },
    { id: 's4', name: 'Silicone Scalp Massager', skus: ['SCALP-WHT'], cat: 'Personal care', cost: 18, packing: 4, open: 150, low: 15, price: { m: 109, f: 99 }, payout: { m: 79, f: 66 }, w: 1.6 },
    { id: 's5', name: 'Glass Oil Dispenser (Press Top)', skus: ['OIL-PRESS-500'], cat: 'Kitchen', cost: 64, packing: 12, open: 30, low: 10, price: { m: 219 }, payout: { m: 152 }, w: 0.7 },
    { id: 's6', name: '3-in-1 Rotary Peeler', skus: ['ROT-PEEL-3'], cat: 'Kitchen', cost: 55, packing: 6, open: 30, low: 10, price: { f: 199 }, payout: { f: 131 }, w: 0.5 }
  ];
  const products = {}; P.forEach(p => { const { w, ...rest } = p; products[p.id] = { ...rest, images: [], active: true }; });
  const chunks = {}; const t = today(); let n = 0;
  for (let back = 74; back >= 0; back--){
    const d = addDays(t, -back);
    for (const p of P){
      for (const pl of ['m', 'f']){
        if (!p.payout[pl]) continue;
        const lam = p.w * (pl === 'm' ? 1 : 0.55) * (0.6 + rnd() * 0.8);
        let k = Math.floor(lam + rnd() - 0.3);
        while (k-- > 0){
          n++; const id = (pl === 'm' ? '1903' : 'OD4') + String(5000000 + n * 37);
          const r = rnd(); let s;
          if (back > 10) s = r < .80 ? 'delivered' : r < .89 ? 'rto' : r < .95 ? 'return' : 'cancelled';
          else if (back > 3) s = r < .55 ? 'delivered' : r < .9 ? 'shipped' : r < .95 ? 'rto' : 'cancelled';
          else s = r < .5 ? 'pending' : r < .95 ? 'shipped' : 'cancelled';
          const q = rnd() < .08 ? 2 : 1;
          const o = { i: id, p: pl, d, pid: p.id, sku: p.skus[0], q, s: p.price[pl] * q, st: s, rs: true, src: 'imp' };
          if (back > 9){
            if (s === 'delivered') o.set = { s: round2(p.payout[pl] * q - (rnd() < .2 ? 3 : 0)) };
            else if (s === 'rto') o.set = { s: 0 };
            else if (s === 'return') o.set = { s: -Math.round(45 + rnd() * 30) };
          }
          const cid = chunkId(pl, monthOf(d), id);
          (chunks[cid] = chunks[cid] || { p: pl, m: monthOf(d), k: 0, rows: {} }).rows[id] = o;
        }
      }
    }
  }
  const exp = {}, stk = {};
  const addE = (d, c, a, nn) => { const m = monthOf(d); (exp[m] = exp[m] || { m, items: {} }).items['e' + d + c] = { id: 'e' + d + c, d, c, a, n: nn }; };
  const addS = (d, pid, q, c, k, sup) => { const m = monthOf(d); (stk[m] = stk[m] || { m, items: {} }).items['k' + d + pid] = { id: 'k' + d + pid, d, pid, q, c, k, sup }; };
  for (let back = 70; back >= 0; back -= 7) addE(addDays(t, -back), 'ads', 350 + Math.round(rnd() * 250), 'Meesho ads');
  for (let back = 60; back >= 0; back -= 30){ addE(addDays(t, -back - 2), 'pack', 1200 + Math.round(rnd() * 400), 'Polybags, tape, bubble wrap'); addE(addDays(t, -back - 1), 'phone', 399, 'Mobile recharge'); }
  addE(addDays(t, -20), 'travel', 260, 'Rickshaw to supplier');
  addS(addDays(t, -40), 's1', 200, 8200, 'buy', 'Relief Road wholesaler');

  addS(addDays(t, -12), 's2', 40, 3080, 'buy', 'Surat supplier');

  SAMPLE = { products, chunks, exp, stk, stats: {}, settings: { ...DEF, biz: 'Sample store' } };
  return SAMPLE;
}

function mapHeaders(hdr){

    if (map.sale != null){ const x = num(rv('sale')); const y = x != null ? x : num(tv('sale')); if (y > 0 && !(o.s > 0)) o.s = round2(y); }

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = (text.slice(0, 4000).split(/\r?\n/)[0]) || '';

  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }

}

async function readFile(file){

    const rows = parseCSV(await file.text());

  if (['xlsx', 'xls', 'xlsm', 'xlsb', 'ods'].includes(ext)){
    const XLSX = await loadXLSX();

function niceTicks(min, max, count){
  if (max === min){ max = min + 1; }
  const span = max - min; const raw = span / count; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 100) / 100);
  return t;
}
function EarningsChart({ T }){
  const ref = useRef(null); const w = useWidth(ref);
  const bs = T.buckets;
  const has = bs.some(b => b.n);
  const lastIdx = (() => { for (let i = bs.length - 1; i >= 0; i--) if (bs[i].n) return i; return bs.length - 1; })();
  const [sel, setSel] = useState(null);
  const si = sel != null && sel < bs.length ? sel : lastIdx;
  const H = 210, padL = 50, padR = 6, padT = 10, padB = 24;
  const maxV = Math.max(1, ...bs.map(b => Math.max(b.inc, b.profit)));
  const minV = Math.min(0, ...bs.map(b => b.profit));
  const ticks = niceTicks(minV, maxV, 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const ih = H - padT - padB, iw = Math.max(40, w - padL - padR);
  const Y = v => padT + ih - (v - y0) / (y1 - y0) * ih;
  const bw = iw / Math.max(1, bs.length); const barW = Math.max(2, Math.min(26, bw * 0.68));
  const every = Math.max(1, Math.ceil(bs.length / Math.max(2, Math.floor(iw / 58))));
  const b = bs[si];
  return html`<div className="card">
    <div className="card-h"><div><h2>Earnings by ${T.bucketName}</h2><p>Payout from platforms and the profit left after product and packing cost</p></div>
      <div className="legend"><span><i style=${{ background: 'var(--bar)' }}></i>Payout</span><span><i style=${{ background: 'var(--good)' }}></i>Profit</span></div></div>
    ${has && b ? html`<div className="readout"><b>${b.label}</b><span>Payout <b className="num">${R0(b.inc)}</b></span><span>Profit <b className=${'num ' + (b.profit < 0 ? 'neg' : '')}>${R0(b.profit)}</b></span><span>${fmtN(b.n)} order${b.n === 1 ? '' : 's'}</span></div>` : null}
    <div className="chart" ref=${ref}>
      ${has ? html`<svg width=${w} height=${H} viewBox=${`0 0 ${w} ${H}`} role="img" aria-label="Payout and profit chart" onMouseLeave=${() => setSel(null)}>
        ${ticks.map(t => html`<g key=${'t' + t}><line className=${t === 0 ? 'ch-zero' : 'ch-grid'} x1=${padL} x2=${w - padR} y1=${Y(t)} y2=${Y(t)}/><text className="ch-t" x=${padL - 6} y=${Y(t) + 4} textAnchor="end">${fmtShort(t)}</text></g>`)}
        ${bs.map((bb, ix) => {
          const cx = padL + bw * ix + bw / 2, x = cx - barW / 2;
          const yInc = Y(Math.max(0, bb.inc)), yZero = Y(0);
          const pr = bb.profit;
          return html`<g key=${bb.key} onMouseEnter=${() => setSel(ix)} onClick=${() => setSel(ix)}>
            ${ix === si ? html`<rect className="ch-sel" x=${padL + bw * ix} y=${padT} width=${bw} height=${ih}/>` : null}
            <rect className="ch-inc" x=${x} y=${yInc} width=${barW} height=${Math.max(0, yZero - yInc)} rx=${Math.min(3, barW / 3)}/>
            ${pr > 0 ? html`<rect className="ch-pro" x=${x + barW * 0.22} y=${Y(pr)} width=${barW * 0.56} height=${Math.max(0, yZero - Y(pr))} rx=${Math.min(2, barW / 4)}/>` : null}
            ${pr < 0 ? html`<rect className="ch-loss" x=${x + barW * 0.22} y=${yZero} width=${barW * 0.56} height=${Math.max(1, Y(pr) - yZero)}/>` : null}
            <rect x=${padL + bw * ix} y=${padT} width=${bw} height=${ih} fill="transparent"/>
            ${ix % every === 0 ? html`<text className="ch-t" x=${cx} y=${H - 6} textAnchor="middle">${bb.label}</text>` : null}
          </g>`;
        })}
      </svg>` : html`<${Empty} icon="chart" title="No orders in this period" text="Your daily payout and profit appear here once orders are imported or added."/>`}
    </div></div>`;
}

    if (filter === 'off'){ if (p.active !== false) return false; }
    else if (p.active === false) return false;
    if (filter === 'low' && s === 'ok') return false;
    if (filter === 'nocost' && Number(p.cost) > 0) return false;
    if (ql && !(p.name || '').toLowerCase().includes(ql) && !(p.skus || []).some(x => x.toLowerCase().includes(ql)) && !(p.cat || '').toLowerCase().includes(ql)) return false;
    return true;
  });
  const A = allTime(D);
  const pack = p => p.packing != null && p.packing !== '' ? Number(p.packing) : Number(D.settings.packing) || 0;
  return html`
    <div className="ph"><div className="ph-t"><h1>Products</h1><p>${fmtN(counts.all)} products · ${fmtN(A.units)} pieces in stock, worth ${R0(A.stockVal)}</p></div>

    </div>

      const cost = Number(p.cost) || 0;
      const prof = k => cost > 0 && p.payout && Number(p.payout[k]) > 0 ? Number(p.payout[k]) - cost - pack(p) : null;
      const pm = prof('m'), pf = prof('f');
      return html`<button key=${p.id} className="pcard" onClick=${() => openProduct(p.id)}>
        <${Thumb} p=${p} size=${72}/>

          <div className="pcard-t">${p.name}</div>
          <div className="pcard-row"><${StockPill} p=${p} D=${D}/>${cost ? html`<span>Cost <b className="num">${fmtINR(cost)}</b></span>` : html`<span className="warn-t">Cost not added</span>`}</div>
          ${pm != null || pf != null ? html`<div className="pcard-row"><span>Profit on 1 piece: ${pm != null ? html`<b className=${'num ' + sgn(pm)}>${fmtINR(pm)}</b> Meesho` : null}${pm != null && pf != null ? ' · ' : ''}${pf != null ? html`<b className=${'num ' + sgn(pf)}>${fmtINR(pf)}</b> Flipkart` : null}</span></div>` : html`<div className="pcard-row muted">Tap to add cost and money you get</div>`}
        </div></button>`;

}

function ReportsView(){
  useStoreV();
  const D = derive();
  const [pk, setPk] = usePeriod();
  const R = periodRange(pk);
  const T = summarize(D, R);
  const cm = monthOf(today());
  const rows = [];
  for (let i = 0; i < 12; i++){
    const m = addMonths(cm, -i);
    const s = D.isLoaded(m) ? computeMonthStats(m, D.byMonth.get(m) || [], D.products, D.settings) : D.stats[m];
    const exp = D.expenses.filter(e => monthOf(e.d) === m).reduce((a, e) => a + (Number(e.a) || 0), 0);
    const buy = D.moves.filter(x => x.k === 'buy' && monthOf(x.d) === m).reduce((a, x) => a + (Number(x.c) || 0), 0);
    const n = s ? s.n : 0;
    if (!n && !exp && !buy && i > 2) continue;
    rows.push({ m, n, inc: s ? (s.recv || 0) + (s.expd || 0) : 0, cost: s ? s.cost || 0 : 0, profit: (s ? s.profit || 0 : 0) - exp, exp, buy, ret: s ? pct((s.rto || 0) + (s.ret || 0), n) : 0, rr: s ? (s.rto || 0) + (s.ret || 0) : 0 });
  }
  const tot = rows.reduce((a, r) => ({ n: a.n + r.n, inc: a.inc + r.inc, cost: a.cost + r.cost, exp: a.exp + r.exp, profit: a.profit + r.profit, buy: a.buy + r.buy, rr: a.rr + r.rr }), { n: 0, inc: 0, cost: 0, exp: 0, profit: 0, buy: 0, rr: 0 });
  const prods = [...T.prod.values()].sort((a, b) => b.profit - a.profit);
  function exportOrders(){
    const out = [['Date', 'Platform', 'Order item ID', 'Order ID', 'Product', 'SKU', 'Qty', 'Status', 'Sale amount', 'Payout received', 'Expected payout', 'Product + packing cost', 'Profit', 'Payment date', 'Note']];
    for (const o of D.orders){ if (!o.d || o.d < R.from || o.d > R.to) continue; const c = D.calc.get(o); const p = D.products[o.pid];
      out.push([o.d, (PLAT[o.p] || PLAT.x).name, o.i, o.o || '', p ? p.name : (o.t || ''), o.sku || '', c.q, STATUS[c.st], o.s || '', c.paid ? c.recv : '', c.paid ? '' : c.expected, c.cost, c.profit, o.pd || '', o.n || '']); }
    saveFile(`orders-${R.from}-to-${R.to}.csv`, toCSV(out));
  }
  function exportPL(){
    const out = [['Month', 'Orders', 'Payout (received + pending)', 'Product & packing cost', 'Expenses', 'Net profit', 'Stock bought', 'Returns + RTO']];
    for (const r of [...rows].reverse()) out.push([monthLabel(r.m), r.n, round2(r.inc), round2(r.cost), round2(r.exp), round2(r.profit), round2(r.buy), r.rr]);
    saveFile(`profit-and-loss-${cm}.csv`, toCSV(out));
  }
  function exportProducts(){
    const out = [['Product', 'SKUs', 'Category', 'Cost per unit', 'Packing', 'In stock', 'Stock value', 'Meesho price', 'Meesho payout', 'Flipkart price', 'Flipkart payout', 'Sold (30 days)']];
    for (const p of D.plist){ const q = D.stock[p.id] || 0; out.push([p.name, (p.skus || []).join(' | '), p.cat || '', p.cost || 0, p.packing != null ? p.packing : D.settings.packing, q, round2(Math.max(0, q) * (Number(p.cost) || 0)), p.price && p.price.m || '', p.payout && p.payout.m || '', p.price && p.price.f || '', p.payout && p.payout.f || '', D.sold30[p.id] || 0]); }
    saveFile(`products-stock-${today()}.csv`, toCSV(out));
  }
  T.bucketName = R.bucket === 'month' ? 'month' : 'day';
  return html`
    <div className="ph"><div className="ph-t"><h1>Reports</h1><p>All the details: charts, months and products</p></div>
      <div className="ph-a"><button className="btn" onClick=${exportPL}><${Icon} n="down"/>Profit & loss CSV</button><button className="btn" onClick=${exportProducts}><${Icon} n="down"/>Products CSV</button></div></div>
    <div className="ph"><h2>${R.label}</h2><${PeriodChips} value=${pk} onChange=${setPk}/></div>
    <${ReportsOverview} D=${D} R=${R} T=${T}/>
    <div className="card"><div className="card-h"><div><h2>Profit & loss by month</h2><p>Payout includes estimated pending payments. Profit is after product cost, packing and expenses.</p></div></div>
      <div className="tbl-wrap"><table className="tbl"><thead><tr><th>Month</th><th className="r hide-sm">Orders</th><th className="r">Payout</th><th className="r hide-sm">Product cost</th><th className="r hide-sm">Expenses</th><th className="r">Net profit</th><th className="r hide-sm">Stock bought</th><th className="r hide-sm">Returns</th></tr></thead>
      <tbody>${rows.map(r => html`<tr key=${r.m}><td>${monthLabel(r.m)}</td><td className="r num hide-sm">${fmtN(r.n)}</td><td className="r num">${R0(r.inc)}</td><td className="r num hide-sm">${R0(r.cost)}</td><td className="r num hide-sm">${R0(r.exp)}</td><td className=${'r num ' + sgn(r.profit)}>${R0(r.profit)}</td><td className="r num hide-sm">${R0(r.buy)}</td><td className="r num hide-sm">${r.ret}%</td></tr>`)}</tbody>
      <tfoot><tr><td>Total</td><td className="r num hide-sm">${fmtN(tot.n)}</td><td className="r num">${R0(tot.inc)}</td><td className="r num hide-sm">${R0(tot.cost)}</td><td className="r num hide-sm">${R0(tot.exp)}</td><td className=${'r num ' + sgn(tot.profit)}>${R0(tot.profit)}</td><td className="r num hide-sm">${R0(tot.buy)}</td><td className="r num hide-sm">${pct(tot.rr, tot.n)}%</td></tr></tfoot></table></div></div>
    <div className="ph"><h2>Products · ${R.label}</h2></div>
    <div className="card">
      ${prods.length ? html`<div className="tbl-wrap"><table className="tbl"><thead><tr><th>Product</th><th className="r hide-sm">Orders</th><th className="r">Units</th><th className="r hide-sm">Payout</th><th className="r">Profit</th><th className="r hide-sm">Profit/unit</th><th className="r hide-sm">Returns</th><th className="r">In stock</th></tr></thead><tbody>
        ${prods.map(r => html`<tr key=${r.key}><td><div className="pn"><${Thumb} p=${D.products[r.pid] || { name: r.name }} size=${34}/><span>${r.name}</span></div></td><td className="r num hide-sm">${fmtN(r.n)}</td><td className="r num">${fmtN(r.q)}</td><td className="r num hide-sm">${R0(r.inc)}</td><td className=${'r num ' + sgn(r.profit)}>${R0(r.profit)}</td><td className="r num hide-sm">${r.q ? fmtINR(r.profit / r.q) : '—'}</td><td className="r num hide-sm">${pct(r.back, r.n)}%</td><td className="r num">${r.pid && D.stock[r.pid] != null ? fmtN(D.stock[r.pid]) : '—'}</td></tr>`)}
      </tbody></table></div>
      <div style=${{ display: 'flex', justifyContent: 'flex-end', paddingTop: 12 }}><button className="btn btn-sm" onClick=${exportOrders}><${Icon} n="down" s=${16}/>Orders CSV for this period</button></div>`

    </div>`;
}

function SetupView(){
  useStoreV();
  const D = derive();
  const [f, setF] = useState(() => ({ biz: st.settings.biz || '', packing: str(st.settings.packing), low: str(st.settings.low), fee: str(st.settings.fee) }));
  const [busy, setBusy] = useState('');
  const [usage, setUsage] = useState(null);
  const [restore, setRestore] = useState(null);
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  async function save(){ setBusy('save'); await attempt(() => saveSettings({ biz: f.biz.trim(), packing: num(f.packing) || 0, low: Math.round(num(f.low) || 0), fee: Math.min(90, Math.max(0, num(f.fee) || 0)) }), 'Settings saved'); setBusy(''); }
  async function backup(){
    setBusy('backup');
    const r = await attempt(async () => { await loadAllMonths(); return JSON.stringify({ app: 'seller-khata', version: 1, exported: new Date().toISOString(), settings: st.settings, products: st.products, ord: st.chunks, exp: st.exp, stk: st.stk, stats: st.stats }); });
    setBusy('');
    if (r.ok) saveFile(`seller-khata-backup-${today()}.json`, r.r);
  }
  async function pickRestore(file){
    try { const obj = JSON.parse(await file.text()); if (!obj || obj.app !== 'seller-khata') throw new Error('This isn’t a Seller Khata backup file.'); setRestore({ name: file.name, obj }); }
    catch (e){ toast(e.message && !e.code ? e.message : 'Couldn’t read this backup file.', 'bad'); }
  }
  async function doRestore(){
    const o = restore.obj; setBusy('restore');
    await attempt(async () => {
      requireDb();
      const jobs = [];
      for (const [id, p] of Object.entries(o.products || {})) jobs.push(['products/' + id, p]);
      for (const [id, d] of Object.entries(o.ord || {})) jobs.push(['ord/' + id, d]);
      for (const [m, d] of Object.entries(o.exp || {})) jobs.push(['exp/' + m, d]);
      for (const [m, d] of Object.entries(o.stk || {})) jobs.push(['stk/' + m, d]);
      for (const [m, d] of Object.entries(o.stats || {})) jobs.push(['stats/' + m, d]);
      if (o.settings) jobs.push(['meta/settings', o.settings]);
      for (const [path, data] of jobs){ await putDoc(path, data); if (path.startsWith('ord/')) st.chunks[path.slice(4)] = data; }
      st.allLoaded = false; await loadAllMonths();
    }, 'Backup restored');
    setBusy(''); setRestore(null);
  }
  async function recalc(){
    setBusy('recalc');
    await attempt(async () => { await loadAllMonths(); const ms = new Set(); for (const ch of Object.values(st.chunks)) ms.add(ch.m); for (const m of Object.keys(st.stats)) ms.add(m); await refreshStats([...ms]); }, 'Totals recalculated');
    setBusy('');
  }
  async function checkUsage(){ if (!st.assets){ toast('Photo storage is only visible to the owner.', 'bad'); return; } try { const r = await st.assets.list(); setUsage(r.usage); } catch (e){ toast(errText(e), 'bad'); } }
  const canSave = !st.sample && !!st.db;
  return html`
    <div className="ph"><div className="ph-t"><h1>Setup</h1><p>Business details, profit settings and your data</p></div></div>
    <div className="g2">
      <div className="card" style=${{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <h2>Business & profit settings</h2>
        <${Field} label="Business name" hint="Shown at the top of your dashboard"><input id="set-biz" className="in" value=${f.biz} onChange=${e => set('biz', e.target.value)} placeholder="e.g. Patel Home Store"/><//>
        <div className="r2">
          <${Field} label="Default packing cost" hint="Per unit: polybag, tape, label"><${Money} id="set-pack" value=${f.packing} onChange=${v => set('packing', v)}/><//>
          <${Field} label="Low stock alert at" hint="Units, for products without their own"><input id="set-low" className="in num" inputMode="numeric" value=${f.low} onChange=${e => set('low', e.target.value)}/><//>
        </div>
        <${Field} label="Platform cut for estimates (%)" hint="Used only when a product has no payout set: estimated payout = sale amount minus this %. Your payment reports replace estimates with real amounts."><input id="set-fee" className="in num" inputMode="decimal" value=${f.fee} onChange=${e => set('fee', e.target.value)}/><//>
        <div><button className="btn btn-p" onClick=${save} disabled=${!canSave || busy === 'save'}>${busy === 'save' ? 'Saving…' : 'Save settings'}</button></div>
      </div>
      <div className="card" style=${{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <h2>How profit is worked out</h2>
        <div className="help"><ul>
          <li><b>Payout</b> is what Meesho or Flipkart pays you, from the payment report. Until it arrives, the product's payout per unit is used as an estimate (shown with ~).</li>
          <li><b>Product cost</b> is cost per unit × quantity, plus packing. Cancelled orders cost nothing.</li>
          <li><b>RTO and returns</b>: the item comes back to stock, so only packing is lost, plus any return charge in the payment report. Untick “back in stock” on an order if the item came back damaged.</li>
          <li><b>Net profit</b> = payout − product & packing cost − expenses.</li>
          <li><b>Stock</b> = opening stock + stock in − orders shipped + good returns ± adjustments.</li>
        </ul></div>
      </div>
    </div>
    <div className="card" style=${{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <h2>Your data</h2>
      <p className="small muted">Your khata is saved online, so it's the same on your phone and computer. Only you can see it.</p>
      ${window.SK_AUTH ? html`<div style=${{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}><span className="small">Signed in as <b>${window.SK_AUTH.email || 'you'}</b></span><button className="btn btn-sm" onClick=${() => window.SK_AUTH.signOut()}>Sign out</button></div>` : null}
      <div style=${{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <button className="btn" onClick=${backup} disabled=${!canSave || !!busy}><${Icon} n="down"/>${busy === 'backup' ? 'Preparing…' : 'Download backup'}</button>
        <label className="btn" aria-disabled=${!canSave}><${Icon} n="upload"/>Restore from backup<input type="file" accept=".json,application/json" style=${{ display: 'none' }} disabled=${!canSave} onChange=${e => { if (e.target.files[0]) pickRestore(e.target.files[0]); e.target.value = ''; }}/></label>
        <button className="btn" onClick=${recalc} disabled=${!canSave || !!busy}>${busy === 'recalc' ? 'Recalculating…' : 'Recalculate totals'}</button>
        <button className="btn" onClick=${checkUsage} disabled=${!canSave}><${Icon} n="image"/>Photo storage</button>
      </div>
      ${usage ? html`<p className="small">Photos: <b className="num">${fmtN(usage.files)}</b> files, <b className="num">${(usage.bytes / 1048576).toFixed(1)} MB</b> of ${(usage.maxBytes / 1048576).toFixed(0)} MB used.</p>` : null}
      ${restore ? html`<${Note} kind="bad">Restoring “${restore.name}” writes ${Object.keys(restore.obj.products || {}).length} products and all orders, expenses and stock entries from that file over the current ones with the same dates. <span style=${{ display: 'inline-flex', gap: 8, marginTop: 8 }}><${Confirm} label="Restore now" sure="Tap again to restore" onConfirm=${doRestore} disabled=${busy === 'restore'}/><button className="btn btn-sm" onClick=${() => setRestore(null)}>Cancel</button></span><//>` : null}
      <div style=${{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
        ${st.sample ? html`<button className="btn" onClick=${() => setSample(false)}>Exit sample data</button>` : html`<button className="btn" onClick=${() => setSample(true)}>Preview with sample data</button>`}
        <span className="small muted">Sample data is never saved. It only shows how the app looks with orders.</span>
      </div>
    </div>`;
}

function ImportView(){
  useStoreV();
  const D = derive();
  const [plat, setPlat] = useState('m');
  const [info, setInfo] = useState(null);
  const [si, setSi] = useState(0);
  const [hr, setHr] = useState(0);
  const [map, setMap] = useState({});
  const [links, setLinks] = useState({});
  const [phase, setPhase] = useState('pick');
  const [prog, setProg] = useState('');
  const [res, setRes] = useState(null);
  const [err, setErr] = useState('');
  const [over, setOver] = useState(false);
  const sheet = info ? info.sheets[si] : null;
  const parsed = useMemo(() => sheet ? buildRows(sheet, hr, map) : null, [sheet, hr, map]);
  const guessed = sheet ? guessPlat(sheet, hr) : null;
  const idx = useMemo(() => orderIndex(), [st.v]);
  const groups = useMemo(() => {
    if (!parsed) return [];
    const g = new Map();
    for (const r of parsed.rows){
      const ex = D.byKey.get(plat + ':' + r.i);
      if (ex && ex.pid) continue;
      if (r.sku && D.skuMap.get(normSku(r.sku))) continue;
      const key = r.sku ? 's:' + normSku(r.sku) : 't:' + (r.t || 'unknown').toLowerCase().slice(0, 60);
      const x = g.get(key) || { key, sku: r.sku || '', title: r.t || '', n: 0 };
      x.n++; if (!x.title && r.t) x.title = r.t; g.set(key, x);
    }
    return [...g.values()].sort((a, b) => b.n - a.n);
  }, [parsed, plat, st.v]);
  const counts = useMemo(() => {
    if (!parsed) return null;
    let add = 0, upd = 0, pay = 0;
    for (const r of parsed.rows){ if (idx.has(plat + ':' + r.i)) upd++; else add++; if (Object.keys(r.settles).length) pay++; }
    return { add, upd, pay };
  }, [parsed, plat, idx]);
  async function onFile(file){
    if (!file) return;
    setErr(''); setPhase('parsing'); setRes(null);
    try {
      const inf = await readFile(file);
      if (!inf.sheets.length) throw new Error('This file is empty.');
      let best = 0, det = null;
      inf.sheets.forEach((s, ix) => { const d = detectSheet(s); if (!det || d.score > det.score){ det = d; best = ix; } });
      setInfo(inf); setSi(best); setHr(det.hr); setMap(det.map); setLinks({});
      const g = guessPlat(inf.sheets[best], det.hr); if (g) setPlat(g);
      setPhase('review');
    } catch (e){ setErr(e.message || 'Couldn’t read this file.'); setPhase('pick'); }
  }
  function pickSheet(ix){ setSi(ix); const d = detectSheet(info.sheets[ix]); setHr(d.hr); setMap(d.map); }
  function setHeaderRow(n){ const r = Math.max(0, Math.min((sheet.text.length || 1) - 1, n)); setHr(r); setMap(mapHeaders((sheet.text[r] || []).map(normH))); }
  function reset(){ setInfo(null); setPhase('pick'); setRes(null); setErr(''); setLinks({}); }
  async function run(){
    if (!parsed || !parsed.rows.length) return;
    setPhase('importing'); setProg('Preparing…');
    const r = await attempt(async () => {
      requireDb();
      const resolved = {};
      for (const g of groups){
        const l = links[g.key];
        if (l === 'new'){
          const id = await saveProduct({ name: g.title || g.sku || 'New product', skus: g.sku ? [g.sku] : [], cost: 0, open: 0, price: {}, payout: {}, images: [], active: true });
          resolved[g.key] = id;
        } else if (l){
          resolved[g.key] = l;
          if (g.sku){ const pr = st.products[l]; if (pr && !(pr.skus || []).some(s => normSku(s) === normSku(g.sku))) await saveProduct({ ...pr, skus: [...(pr.skus || []), g.sku] }); }
        }
      }
      const skuMap = new Map(); for (const p of Object.values(st.products)) for (const s of (p.skus || [])) skuMap.set(normSku(s), p.id);
      const months = new Set(parsed.rows.map(x => monthOf(x.d || x.pd || today())));
      setProg('Loading your earlier orders…');
      await ensureMonths([...months]);
      const ix = orderIndex(); const edits = []; let add = 0, upd = 0, pay = 0;
      for (const x of parsed.rows){
        const cid = ix.get(plat + ':' + x.i); const old = cid ? st.chunks[cid].rows[x.i] : null;
        const o = old ? { ...old, set: { ...(old.set || {}) } } : { i: x.i, p: plat, set: {}, rs: true, src: 'imp' };
        for (const k of ['o', 'd', 'sku', 't', 'q', 's', 'st', 'sr', 'pd']) if (x[k] !== undefined && x[k] !== '') o[k] = x[k];
        if (Object.keys(x.settles).length){ Object.assign(o.set, x.settles); pay++; }
        if (!Object.keys(o.set).length) delete o.set;
        if (!o.d) o.d = x.pd || today();
        if (!o.q) o.q = 1;
        if (!o.st) o.st = o.set ? 'delivered' : 'pending';
        if (!o.pid){ const pid = (x.sku && skuMap.get(normSku(x.sku))) || resolved[x.sku ? 's:' + normSku(x.sku) : 't:' + (x.t || 'unknown').toLowerCase().slice(0, 60)]; if (pid) o.pid = pid; }
        o.u = Date.now();
        edits.push({ p: plat, i: x.i, next: o }); if (old) upd++; else add++;
      }
      setProg(`Saving ${fmtN(edits.length)} orders…`);
      await commitOrders(edits, (a, b) => setProg(`Saving… ${Math.round(a / b * 100)}%`));
      return { add, upd, pay, linked: edits.filter(e => e.next.pid).length, total: edits.length };
    });
    if (r.ok){ setRes(r.r); setPhase('done'); } else setPhase('review');
  }
  const help = plat === 'f'
    ? html`<ul><li><b>Orders file</b>: in Seller Hub, open Orders or Reports and download the orders report (CSV or Excel). It brings in status: delivered, returned, cancelled.</li><li><b>Payment file</b>: open Payments and download the settlement report (Excel). Its Orders sheet has the bank settlement value for each order item. This is what you actually received.</li></ul>`
    : plat === 'm'
    ? html`<ul><li><b>Orders file</b>: in the Meesho Supplier Panel, open Orders and download the orders list (CSV). It brings in status: delivered, RTO, returns, cancelled.</li><li><b>Payment file</b>: open Payments and download the payment report (Excel). Its Order Payments sheet has the final settlement amount for each sub order. This is what you actually received.</li></ul>`
    : html`<ul><li>Any CSV or Excel file with one row per order works. You'll match its columns on the next step.</li></ul>`;
  return html`
    <div className="ph"><div className="ph-t"><h1>Upload file</h1><p>Upload the orders or payments file from Meesho or Flipkart. Uploading the same file again is safe: nothing is counted twice.</p></div></div>
    ${phase === 'done' && res ? html`<div className="card"><${Empty} icon="check" title="Import finished" text=${`${fmtN(res.add)} new order${res.add === 1 ? '' : 's'} added and ${fmtN(res.upd)} updated. ${res.pay ? fmtN(res.pay) + ' payment' + (res.pay === 1 ? '' : 's') + ' recorded. ' : ''}${res.total - res.linked ? fmtN(res.total - res.linked) + ' order' + (res.total - res.linked === 1 ? ' is' : 's are') + ' not linked to a product yet.' : 'All orders are linked to products.'}`}>
        <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center' }}><button className="btn btn-p" onClick=${() => go('home')}>See dashboard</button><button className="btn" onClick=${() => go('orders')}>View orders</button><button className="btn" onClick=${reset}>Import another file</button></div><//></div>` : null}
    ${phase === 'pick' || phase === 'parsing' ? html`
      <div className="card" style=${{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div className="field"><span>Report from</span><div className="seg" role="group">${[['m', 'Meesho'], ['f', 'Flipkart'], ['x', 'Other']].map(([k, l]) => html`<button key=${k} aria-pressed=${plat === k} onClick=${() => setPlat(k)}>${l}</button>`)}</div></div>
        <div className="help">${help}<p className="muted">Upload the file exactly as downloaded. Opening and saving it in Excel first can damage long order IDs.</p></div>
        <label className=${'drop' + (over ? ' over' : '')} onDragOver=${e => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)} onDrop=${e => { e.preventDefault(); setOver(false); onFile(e.dataTransfer.files[0]); }}>
          <${Icon} n="upload" s=${28}/><b>${phase === 'parsing' ? 'Reading file…' : 'Choose a CSV or Excel file'}</b><span className="small muted">or drag it here · .csv, .xlsx, .xls</span>
          <input type="file" accept=".csv,.xlsx,.xls,.xlsm,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" disabled=${phase === 'parsing'} onChange=${e => { onFile(e.target.files[0]); e.target.value = ''; }}/>
        </label>
        ${err ? html`<${Note} kind="bad">${err}<//>` : null}
      </div>` : null}
    ${(phase === 'review' || phase === 'importing') && sheet && parsed ? html`
      <div className="card" style=${{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div className="card-h" style=${{ marginBottom: 0 }}><div><h2>${info.name}</h2><p>${fmtN(parsed.total)} rows with an order ID · ${fmtN(parsed.rows.length)} unique orders</p></div><button className="btn btn-sm" onClick=${reset} disabled=${phase === 'importing'}>Choose another file</button></div>
        <div className="field"><span>Report from</span><div className="seg" role="group">${[['m', 'Meesho'], ['f', 'Flipkart'], ['x', 'Other']].map(([k, l]) => html`<button key=${k} aria-pressed=${plat === k} onClick=${() => setPlat(k)}>${l}</button>`)}</div></div>
        <div className="r2">
          ${info.sheets.length > 1 ? html`<${Field} label="Sheet"><select className="in" value=${si} onChange=${e => pickSheet(Number(e.target.value))}>${info.sheets.map((s, ix) => html`<option key=${ix} value=${ix}>${s.name}</option>`)}</select><//>` : null}
          <${Field} label="Column names are on row"><input className="in num" type="number" min="1" value=${hr + 1} onChange=${e => setHeaderRow((parseInt(e.target.value) || 1) - 1)}/><//>
        </div>
        ${guessed && guessed !== plat ? html`<${Note}>This looks like a ${PLAT[guessed].name} file. <button className="btn-link" onClick=${() => setPlat(guessed)}>Switch to ${PLAT[guessed].name}</button><//>` : null}
        ${map.id == null ? html`<${Note} kind="bad">Pick the column that holds the order item ID (Sub Order No on Meesho, Order item ID on Flipkart). It's needed to match orders.<//>` : null}
        ${parsed.sci ? html`<${Note} kind="bad">${fmtN(parsed.sci)} order IDs look damaged (like 4.36E+17), probably because the file was saved in Excel. Download the report again and upload it without opening it.<//>` : null}
        ${map.id != null && !parsed.rows.length ? html`<${Note} kind="bad">No orders found below row ${hr + 1}. Check that the order item ID column and the column-names row are right.<//>` : null}
        ${parsed.bad ? html`<${Note}>${fmtN(parsed.bad)} rows were skipped because their order ID doesn't look like an ID.<//>` : null}
        ${map.id != null && map.date == null && parsed.rows.length ? html`<${Note}>No order date column found. ${parsed.noDate ? 'Orders without a date use the payment date or today.' : ''}<//>` : null}
        <div className="sec-t">Columns</div>
        <div className="map-grid">
          <span className="hd">Field</span><span className="hd">Column in your file</span><span className="hd sample">First value</span>
          ${FIELDS.map(fd => {
            const ci = map[fd.k]; const first = ci != null ? (sheet.text.slice(hr + 1).find(r => r && r[ci] !== '' && r[ci] != null) || [])[ci] : '';
            return html`<${React.Fragment} key=${fd.k}><span><b>${fd.label}</b>${fd.req ? html` <span className="neg">*</span>` : null}${fd.help ? html`<br/><span className="small muted">${fd.help}</span>` : null}</span>
              <select className="in" value=${ci == null ? '' : ci} onChange=${e => { const v = e.target.value; setMap(m => { const n = { ...m }; if (v === '') delete n[fd.k]; else { for (const k of Object.keys(n)) if (n[k] === Number(v)) delete n[k]; n[fd.k] = Number(v); } return n; }); }}>
                <option value="">Not in this file</option>
                ${(sheet.text[hr] || []).map((h, ix) => html`<option key=${ix} value=${ix}>${colName(ix)} · ${String(h || '(blank)').slice(0, 48)}</option>`)}
              </select><span className="sample">${first ? String(first).slice(0, 40) : '—'}</span><//>`;
          })}
        </div>
        ${parsed.rows.length ? html`<div className="sec-t">Preview</div>
          <div className="tbl-wrap"><table className="tbl nowrap"><thead><tr><th>Order item ID</th><th>Date</th><th>SKU</th><th className="r">Qty</th><th>Status</th><th className="r">Sale</th><th className="r">Payout</th></tr></thead><tbody>
            ${parsed.rows.slice(0, 6).map(x => html`<tr key=${x.i}><td className="num">${x.i}</td><td>${x.d ? dayLabel(x.d) : '—'}</td><td className="num">${x.sku || '—'}</td><td className="r num">${x.q || 1}</td><td>${x.st ? html`<${Status} s=${x.st}/>` : '—'}</td><td className="r num">${x.s ? fmtINR(x.s) : '—'}</td><td className="r num">${Object.keys(x.settles).length ? fmtINR(sumSet(x.settles)) : '—'}</td></tr>`)}
          </tbody></table></div>` : null}
      </div>
      ${groups.length ? html`<div className="card" style=${{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div><h2>Match products</h2><p className="small muted">These SKUs aren't linked to any of your products yet. Link each one so cost and stock are counted. The app remembers the SKU for next time.</p></div>
        <div className="list">${groups.map(g => html`<div key=${g.key} className="lrow" style=${{ gridTemplateColumns: 'minmax(0,1fr) minmax(0,1fr)' }}>
          <div className="lrow-m"><div className="lrow-t">${g.sku ? html`<span className="sku">${g.sku}</span>` : 'No SKU'}</div><div className="lrow-s">${g.title ? g.title : ''} · ${fmtN(g.n)} order${g.n === 1 ? '' : 's'}</div></div>
          <select className="in" value=${links[g.key] || ''} onChange=${e => setLinks(l => ({ ...l, [g.key]: e.target.value }))} aria-label=${'Product for ' + (g.sku || g.title)}>
            <option value="">Leave unlinked for now</option><option value="new">＋ Create new product</option>
            ${D.plist.map(p => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}
          </select></div>`)}</div>
      </div>` : null}
      <div className="card" style=${{ display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap' }}>
        <div className="grow" style=${{ minWidth: 220 }}>${counts ? html`<b>${fmtN(counts.add)}</b> new order${counts.add === 1 ? '' : 's'} · <b>${fmtN(counts.upd)}</b> to update · <b>${fmtN(counts.pay)}</b> with payout` : null}<div className="small muted">${phase === 'importing' ? prog : `Platform: ${PLAT[plat].name}`}</div></div>
        <button className="btn btn-p" onClick=${run} disabled=${phase === 'importing' || !parsed.rows.length || map.id == null}>${phase === 'importing' ? 'Importing…' : `Import ${fmtN(parsed.rows.length)} orders`}</button>
      </div>` : null}`;
}

/* ======================= app ======================= */
const NAV = [['home', 'home', 'Home'], ['orders', 'orders', 'Orders'], ['products', 'box', 'Products'], ['expenses', 'wallet', 'Expenses'], ['reports', 'chart', 'Reports'], ['import', 'upload', 'Upload file'], ['setup', 'sliders', 'Setup']];
function App(){
  useStoreV(); useUI();
  const view = ui.view;
  const V = { home: HomeView, orders: OrdersView, products: ProductsView, expenses: ExpensesView, reports: ReportsView, setup: SetupView, import: ImportView }[view] || HomeView;
  const live = st.phase === 'live' || st.sample;
  const tabs = [['home', 'home', 'Home'], ['orders', 'orders', 'Orders'], ['add', 'plus', 'Add'], ['products', 'box', 'Products'], ['more', 'more', 'More']];
  return html`<div className="app">
    <aside className="side"><div className="side-in">
      <${Brand}/>
      <nav aria-label="Main">${NAV.map(([k, i, l]) => html`<button key=${k} className="nav-btn" aria-current=${view === k ? 'page' : undefined} onClick=${() => go(k)}><${Icon} n=${i}/>${l}</button>`)}</nav>
      <div className="side-add"><button className="btn btn-p" onClick=${openQuickAdd}><${Icon} n="plus"/>Add</button></div>
      <div className="side-foot"><span className=${'dot ' + (st.db && !st.sample ? '' : 'off')}></span><span>${st.sample ? 'Sample data, not saved' : st.db ? 'Saved online · same on phone and computer' : st.phase === 'loading' ? 'Connecting…' : 'Saving unavailable in this view'}</span></div>
    </div></aside>
    <div className="col">
      <header className="topbar"><${Brand} compact=${true}/><span className="grow"></span>
        <button className="icon-btn" aria-label="Upload file" onClick=${() => go('import')}><${Icon} n="upload"/></button></header>
      <main className="main"><div className="wrap" key=${view}>
        <${Banners}/>
        ${live || st.phase === 'nodb' ? html`<${V}/>` : html`<${Loading}/>`}
      </div></main>
    </div>
    <nav className="tabbar" aria-label="Main">${tabs.map(([k, i, l]) => k === 'add'
      ? html`<button key=${k} className="tab tab-add" onClick=${openQuickAdd} aria-label="Add"><span className="plus"><${Icon} n="plus" s=${24}/></span></button>`
      : html`<button key=${k} className="tab" aria-current=${(k === view || (k === 'more' && ['expenses', 'reports', 'import', 'setup'].includes(view))) ? 'page' : undefined} onClick=${() => k === 'more' ? openMore() : go(k)}><${Icon} n=${i} s=${22}/>${l}</button>`)}</nav>
    <${SheetHost}/><${Toasts}/>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
